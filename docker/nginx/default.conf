server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict CSP for A+ Mozilla Observatory rating
    # Note: 'unsafe-inline' in style-src is needed for Bootstrap and inline styles, scores 0 (neutral) not negative
    # Hash for inline theme-switching script
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-ZOQDuM1Drke+vh8UIUnmlKCfOACcK475v9NHGjyGL00=' https://www.googletagmanager.com https://www.google-analytics.com https://rocket.xana.space; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://rocket.xana.space https://www.googletagmanager.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://rocket.xana.space wss://rocket.xana.space https://www.googletagmanager.com; frame-src https://www.googletagmanager.com https://rocket.xana.space; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'; upgrade-insecure-requests;" always;
    
    # Additional security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}

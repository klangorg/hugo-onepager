## Homepage about
- id: "about_title"
  translation: "Wer bin ich?"

- id: "about_content"
  translation: '<p class="lead">Als unabhängiger DevOps Engineer liegt mein Fokus auf der Entwicklung automatisierter und skalierbarer Infrastrukturen. Ich optimiere Deployment und Betriebssicherheit mittels Infrastructure as Code, Kubernetes und CI/CD-Pipelines, um wirtschaftlich stabile Ergebnisse zu liefern. Das Ergebnis: Schnellere Releases, höhere Systemstabilität, planbare Kosten.</p><p class="lead">Meine Basis ist Integrität: Ich stehe für transparente Kommunikation und engagiere mich bewusst nur in der zivilen Entwicklung. Diese klare Haltung schafft Vertrauen und ermöglicht nachhaltigen Fokus auf zukunftsorientierte Technologie.</p><p class="lead">Kontinuierliche Praxisprojekte sichern, dass meine Kunden stets von den aktuellsten Industry Best Practices profitieren. Ich vertiefe praktisches Wissen in Automatisierung, Container-Orchestrierung und Monitoring.</p>'

- id: "about_button"
  translation: "Über mich"


## Homepage about
- id: "about_title"
  translation: "Wer bin ich?"

- id: "about_content"
  translation: '<p class="lead">Als selbstständiger DevOps Engineer automatisiere ich Linux- und Windows-Umgebungen, entwickle reproduzierbare Deployment- und Migrationsabläufe und löse technische Probleme über System- und Anwendungsgrenzen hinweg.</p><p class="lead">Dokumentation und Wissenstransfer gehören zu meiner Arbeit, damit interne Teams die Lösungen selbstständig weiterbetreiben können.</p><p class="lead">Ich stehe für offene und direkte Kommunikation und arbeite bewusst nicht mit militärischen oder rüstungsindustriellen Kunden zusammen.</p>'


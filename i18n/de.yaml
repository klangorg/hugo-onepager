## Homepage showcase
- id: "showcase_title"
  translation: "DevOps Engineering für automatisierte und wartbare Infrastruktur"

- id: "showcase_subtitle"
  translation: "Infrastrukturautomatisierung, Migrationen und Atlassian"

- id: "showcase_description"
  translation: "Ich unterstütze IT-Teams, wenn manuelle Betriebsaufgaben zu viel Zeit beanspruchen, Migrationen stocken oder komplexe Infrastrukturprobleme Projekte ausbremsen. Ich automatisiere Linux- und Windows-Umgebungen, entwickle reproduzierbare Deployment- und Migrationsabläufe und löse technische Probleme über Systemgrenzen hinweg. Dokumentation und Wissenstransfer gehören dazu, damit interne Teams die Lösungen selbstständig weiterbetreiben können."


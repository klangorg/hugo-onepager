## Homepage about
- id: "about_title"
  translation: "Who am I?"

- id: "about_content"
  translation: '<p class="lead">As an independent DevOps Engineer, I focus on developing automated and scalable infrastructures. I optimize deployment and operational stability using Infrastructure as Code, Kubernetes, and CI/CD pipelines, aiming for economically stable results. The outcome: Faster releases, higher system stability, predictable costs.</p><p class="lead">My foundation is integrity: I stand for transparent communication and consciously engage only in civilian development. This clear stance builds trust and enables sustainable focus on future-oriented technology.</p><p class="lead">Continuous hands-on projects ensure my clients always benefit from the latest industry best practices. I deepen practical knowledge in automation, container orchestration, and monitoring.</p>'

- id: "about_button"
  translation: "About Me"


## Homepage showcase
- id: "showcase_title"
  translation: "DevOps engineering for automated, maintainable infrastructure"

- id: "showcase_subtitle"
  translation: "Infrastructure automation, migrations and Atlassian"

- id: "showcase_description"
  translation: "I help IT teams when manual operations take up too much time, migrations stall or complex infrastructure issues hold projects back. I automate Linux and Windows environments, build repeatable deployment and migration workflows and troubleshoot issues across systems and applications. Documentation and knowledge transfer are part of my work, so internal teams can maintain the solutions independently."


## Homepage about
- id: "about_title"
  translation: "Who am I?"

- id: "about_content"
  translation: <p class="lead">
      As an IT professional, I believe in empathetic analysis to understand both developers' and users' needs. My constant willingness to learn is driven by enthusiasm for discovering new solutions and making the right connections.
      </p>
      <p class="lead">
      Open and direct communication is one of my core values. As an independent consultant, I'm committed to peaceful civil development and deliberately choose not to work with military or arms industry clients.
      </p>
      <p class="lead">
      I balance my tech focus with environmental consciousness and nature-oriented gardening. Beyond my professional work, I enjoy working on various home server projects during my free time, continuously expanding my IT skills.
    </p>

- id: "about_button"
  translation: "About Me"


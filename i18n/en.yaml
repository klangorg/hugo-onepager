- id: "about_content"
  translation: '<p class="lead">As a freelance DevOps Engineer, I automate Linux and Windows environments, build repeatable deployment and migration workflows and troubleshoot issues across systems and applications.</p><p class="lead">Documentation and knowledge transfer are part of my work, so internal teams can maintain the solutions independently.</p><p class="lead">I value open and direct communication and deliberately do not work with military or arms industry clients.</p>'


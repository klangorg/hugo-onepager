## Homepage about
- id: "about_title"
  translation: "Who am I?"

- id: "about_content"
  translation: <p class="lead">
      As a DevOps engineer, I focus on infrastructure automation and deployment process optimization. I develop scalable solutions using Infrastructure as Code, container orchestration, and CI/CD pipelines. My approach combines technical depth with pragmatic problem-solving.
      </p>
      <p class="lead">
      Open and direct communication is one of my core values. As an independent DevOps specialist, I'm committed to peaceful civil development and deliberately choose not to work with military or arms industry clients.
      </p>
      <p class="lead">
      In my free time, I run home server projects with Docker, Ansible, and monitoring stacks. There I experiment with new technologies and keep my skills current. Beyond IT, I balance my technical interests with environmental consciousness and nature-oriented gardening.
    </p>

- id: "about_button"
  translation: "About Me"


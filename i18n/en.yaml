## Homepage showcase
- id: "showcase_title"
  translation: "IT expertise for your digital success"

- id: "showcase_subtitle"
  translation: "Passion for IT since 1997"

- id: "showcase_description"
  translation: "My enthusiasm for computers began in 1997, when I used my first PC at the age of 10: Windows 95 on a Pentium I - high-end at the time! 😄 Since then, my fascination with technology has never left me.

This year, I celebrated my 12th anniversary in the IT industry. A lot has changed, but my passion for IT remains - and my enthusiasm for solving complex problems. 😊"


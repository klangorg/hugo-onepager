<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a32a3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6f42c1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle (Abstract) -->
  <circle cx="400" cy="300" r="260" fill="#f3f0fa" />
  
  <!-- Laptop Base -->
  <path d="M200,400 L600,400 L580,420 L220,420 Z" fill="#343a40" filter="url(#softShadow)" />
  <rect x="220" y="250" width="360" height="150" rx="8" fill="#343a40" /> <!-- Screen Bezel -->
  <rect x="230" y="260" width="340" height="130" fill="#1a1d20" /> <!-- Screen Area -->
  
  <!-- Code Lines on Screen -->
  <rect x="240" y="270" width="100" height="4" rx="2" fill="#6f42c1" opacity="0.8" />
  <rect x="240" y="280" width="180" height="4" rx="2" fill="#6c757d" opacity="0.5" />
  <rect x="240" y="290" width="140" height="4" rx="2" fill="#6c757d" opacity="0.5" />
  
  <rect x="240" y="310" width="80" height="4" rx="2" fill="#6f42c1" opacity="0.8" />
  <rect x="240" y="320" width="200" height="4" rx="2" fill="#6c757d" opacity="0.5" />
  <rect x="240" y="330" width="160" height="4" rx="2" fill="#6c757d" opacity="0.5" />
  
  <!-- DevOps Infinity Loop Symbol (Stylized) -->
  <path d="M400,180 C360,180 340,200 320,220 C300,240 260,240 240,220 C220,200 220,160 240,140 C260,120 300,120 320,140 C340,160 360,180 400,180 Z" fill="none" stroke="url(#gradPrimary)" stroke-width="12" stroke-linecap="round" opacity="0.2" />
  <path d="M400,180 C440,180 460,200 480,220 C500,240 540,240 560,220 C580,200 580,160 560,140 C540,120 500,120 480,140 C460,160 440,180 400,180 Z" fill="none" stroke="url(#gradPrimary)" stroke-width="12" stroke-linecap="round" opacity="0.2" />
  
  <!-- Server Stack (Right Side) -->
  <g transform="translate(520, 280)">
    <rect x="0" y="0" width="100" height="140" rx="4" fill="#e9ecef" filter="url(#softShadow)" />
    <!-- Server Units -->
    <rect x="10" y="15" width="80" height="10" rx="2" fill="#fff" />
    <circle cx="80" cy="20" r="2" fill="#6f42c1" />
    
    <rect x="10" y="35" width="80" height="10" rx="2" fill="#fff" />
    <circle cx="80" cy="40" r="2" fill="#6f42c1" />
    
    <rect x="10" y="55" width="80" height="10" rx="2" fill="#fff" />
    <circle cx="80" cy="60" r="2" fill="#6f42c1" />
    
    <rect x="10" y="75" width="80" height="10" rx="2" fill="#fff" />
    <circle cx="80" cy="80" r="2" fill="#6f42c1" />
  </g>
  
  <!-- Cloud Icon (Left Side) -->
  <g transform="translate(150, 220)">
    <path d="M50,50 Q50,20 80,20 Q90,0 120,10 Q150,-10 180,20 Q210,20 210,50 Q230,60 210,80 L80,80 Q50,80 50,50 Z" fill="url(#gradPrimary)" filter="url(#softShadow)" opacity="0.9" />
    <text x="100" y="60" font-family="sans-serif" font-size="14" fill="#fff" font-weight="bold">CLOUD</text>
  </g>
  
  <!-- Connection Lines -->
  <path d="M210,260 L250,300" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />
  <path d="M520,320 L500,320" stroke="#6f42c1" stroke-width="2" stroke-dasharray="5,5" opacity="0.5" />

</svg>
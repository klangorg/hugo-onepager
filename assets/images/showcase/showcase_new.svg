<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6f42c1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2c8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8561d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6f42c1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Abstract Background Elements -->
  <circle cx="400" cy="300" r="280" fill="#f3f0fa" />
  <circle cx="600" cy="150" r="50" fill="#e0d4f5" opacity="0.5" />
  <circle cx="150" cy="500" r="80" fill="#e0d4f5" opacity="0.5" />
  
  <!-- Main Cloud Shape -->
  <path d="M250,320 Q250,260 310,260 Q330,210 400,220 Q450,170 520,220 Q580,220 580,290 Q620,310 580,370 L310,370 Q250,370 250,320 Z" fill="url(#grad1)" filter="url(#shadow)" />
  
  <!-- Floating Elements -->
  
  <!-- Server Icon -->
  <g transform="translate(320, 340)">
    <rect x="0" y="0" width="80" height="100" rx="4" fill="#ffffff" filter="url(#shadow)" />
    <rect x="10" y="15" width="60" height="8" rx="2" fill="#e9ecef" />
    <rect x="10" y="35" width="60" height="8" rx="2" fill="#e9ecef" />
    <rect x="10" y="55" width="60" height="8" rx="2" fill="#e9ecef" />
    <circle cx="60" cy="19" r="2" fill="#20c997" />
    <circle cx="60" cy="39" r="2" fill="#20c997" />
    <circle cx="60" cy="59" r="2" fill="#20c997" />
  </g>
  
  <!-- Terminal Window -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="140" height="90" rx="4" fill="#2d2d2d" filter="url(#shadow)" />
    <rect x="0" y="0" width="140" height="20" rx="4" fill="#444" />
    <rect x="0" y="10" width="140" height="10" fill="#444" /> <!-- Cover bottom rounded corners of header -->
    <circle cx="10" cy="10" r="3" fill="#ff5f56" />
    <circle cx="20" cy="10" r="3" fill="#ffbd2e" />
    <circle cx="30" cy="10" r="3" fill="#27c93f" />
    
    <text x="10" y="40" font-family="monospace" font-size="10" fill="#20c997">> docker-compose up</text>
    <text x="10" y="55" font-family="monospace" font-size="10" fill="#ffffff">Building...</text>
    <rect x="10" y="65" width="80" height="6" rx="3" fill="#6f42c1" />
  </g>
  
  <!-- Gear Icon (Automation) -->
  <g transform="translate(260, 240)">
    <path d="M45,0 L55,0 L60,15 L75,20 L90,10 L100,15 L95,30 L105,40 L120,40 L120,50 L105,50 L95,60 L100,75 L90,80 L75,70 L60,75 L55,90 L45,90 L40,75 L25,70 L10,80 L0,75 L5,60 L-5,50 L-20,50 L-20,40 L-5,40 L5,30 L0,15 L10,10 L25,20 L40,15 Z" fill="url(#grad2)" transform="scale(0.6)" filter="url(#shadow)" />
    <circle cx="30" cy="27" r="8" fill="#ffffff" />
  </g>
  
  <!-- Code Brackets -->
  <text x="580" y="420" font-family="monospace" font-size="60" font-weight="bold" fill="#6f42c1" opacity="0.2">&lt;/&gt;</text>
  
</svg>
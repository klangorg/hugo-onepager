baseURL = "https://max-it.tech"
languageCode = "de"
defaultContentLanguage = "de"
enableRobotsTXT = true

[[module.imports]]
  path = 'github.com/zetxek/adritian-free-hugo-theme'

theme = "adritian-free-hugo-theme"

[params]

  title = 'Max Rößler - IT Freelancer & DevOps Engineer | Dresden'
  description = 'Experienced IT freelancer and DevOps engineer with 12+ years in CI/CD, Infrastructure as Code, container technologies, Linux administration, and cloud migrations. Based in Dresden, Germany.'
  images = ['/android-chrome-512x512.png']
  sections = ["showcase", "about", "education", "experience", "client-and-work", "testimonial", "contact", "newsletter"]

  # SEO and Social Media
  author = 'Max Rößler'
  keywords = ['IT Freelancer', 'DevOps Engineer', 'CI/CD', 'Infrastructure as Code', 'Docker', 'Kubernetes', 'Linux', 'Cloud Migration', 'Dresden', 'Germany']

  # If you want to display an image logo in the header, you can add it here
  logo = '/img/logo.svg'

  homepageExperienceCount = 2

  [params.analytics]
  ## Analytics parameters.
  ### Supported so far: Vercel (Page Insights, Analytics)
  ### And Google (Tag Manager, Analytics)

  # controls vercel page insights - disabled by default
  # to enable, just set to true
  vercelPageInsights = false
  vercelAnalytics = false
  
  # google analytics and tag manager. to enable, set "enabled" to true
  # and add the tracking code (UA-something for analytics, GTM-something for tag manager)
  [params.analytics.googleAnalytics]
      code = "UA-XXXXX-Y"
      enabled = false
  [params.analytics.googleTagManager]
      code = "GTM-XXXXX"
      enabled = false

[build]
  [build.buildStats]
    disableClasses = false
    disableIDs = false
    disableTags = false
    enable = true

[params.languages.selector.disable]
  footer = false

